name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://ecarnet:ecarnet-test-only@localhost:5432/ecarnet
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecarnet
          POSTGRES_USER: ecarnet
          POSTGRES_PASSWORD: ecarnet-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecarnet -d ecarnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances verrouillées (versions exactes + empreintes)
        run: python scripts/check-requirements-lock.py
      - run: pip install -r apps/api/requirements.txt
      - name: Installer qpdf pour les tests de documents PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf
      - run: python apps/api/manage.py check
      - run: python apps/api/manage.py makemigrations --check --dry-run
      - name: Tests d’intégration Django (PostgreSQL)
        working-directory: apps/api
        run: python manage.py test
      - name: Vérifier la syntaxe du contrôle de surveillance
        run: bash -n ops/monitoring-check.sh
      - name: Tester la sonde de surveillance (OK et panne)
        run: python ops/test-monitoring-check.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=@ecarnet/web
      - run: npm run typecheck --workspace=@ecarnet/web
      - run: npm run test:web
      - run: npm run build --workspace=@ecarnet/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=@ecarnet/web
