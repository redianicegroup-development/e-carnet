# Blueprint Render — API Django V1
# À connecter au dépôt depuis le tableau de bord Render.
# Les secrets et DATABASE_URL Neon doivent rester saisis dans Render.
services:
  - type: web
    name: ecarnet-api
    runtime: docker
    plan: free
    rootDir: .
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/v1/health/ready/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ecarnet-api.onrender.com,e-carnetci.vercel.app
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        value: https://e-carnetci.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://e-carnetci.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://e-carnetci.vercel.app
      - key: ECARNET_INVITATION_BASE_URL
        value: https://e-carnetci.vercel.app/etablissement/activation
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ECARNET_QR_TTL_SECONDS
        value: "300"
      - key: ECARNET_SESSION_AGE_SECONDS
        value: "28800"
