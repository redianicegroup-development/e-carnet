<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFF7E6">
  <title>Hors connexion — Mon E-Carnet</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #FFF7E6; color: #1E3A34; font: 400 1.0625rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(100%, 26rem); display: grid; gap: 16px; justify-items: center; text-align: center; padding: 28px 22px; border-radius: 26px; background: #FFF7E6; box-shadow: 8px 8px 18px rgb(30 58 52 / .14), -8px -8px 18px rgb(255 255 255 / .9); }
    img { width: 72px; height: 72px; }
    h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; }
    p { margin: 0; }
    .muted { color: #4a5f58; font-size: .95rem; }
    button { min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: #1E3A34; color: #FFF7E6; font: inherit; font-weight: 650; cursor: pointer; }
    button:focus-visible { outline: 3px solid #4BAA8B; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/app-icon.svg" alt="" width="72" height="72">
    <h1>Vous êtes hors connexion</h1>
    <p>Votre carnet se charge avec le réseau : vos informations de santé ne sont pas gardées sur ce téléphone.</p>
    <p class="muted">Votre carte d’urgence déjà ouverte sur cet appareil reste consultable hors connexion pendant 24 h.</p>
    <button type="button" id="retry">Réessayer</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
