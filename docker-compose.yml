name: e-carnet

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecarnet}
      POSTGRES_USER: ${POSTGRES_USER:-ecarnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecarnet-dev-only-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-before-sharing}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgres://${POSTGRES_USER:-ecarnet}:${POSTGRES_PASSWORD:-ecarnet-dev-only-change-me}@db:5432/${POSTGRES_DB:-ecarnet}
      WEB_ORIGIN: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: development
    command: ["npm", "run", "dev", "--workspace=@ecarnet/web"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages/ui:/workspace/packages/ui
      - web_node_modules:/workspace/node_modules
      - web_next_build:/workspace/apps/web/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  web_node_modules:
  web_next_build:
