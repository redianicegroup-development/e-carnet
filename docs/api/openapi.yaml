openapi: 3.1.0
info:
  title: Mon Carnet Numérique API
  version: 0.1.0
  description: Contrat de la tranche Fondation. Pas de données cliniques exposées.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health/:
    get:
      summary: Vérifier la disponibilité historique de l’API
      security: []
      responses:
        '200':
          description: API opérationnelle
  /health/live/:
    get:
      summary: Vérifier que le processus API répond
      security: []
      responses:
        '200':
          description: Processus opérationnel
  /health/ready/:
    get:
      summary: Vérifier que l’API peut joindre sa base
      security: []
      responses:
        '200':
          description: API prête
        '503':
          description: Base indisponible ; la réponse ne divulgue aucun détail de connexion
  /csrf/:
    get:
      summary: Obtenir un cookie CSRF pour les requêtes navigateur
      security: []
      responses:
        '200':
          description: Jeton CSRF établi dans un cookie
  /identity/me/theme/:
    get:
      summary: Charger les préférences de thème du compte authentifié
      responses:
        '200':
          description: Thème du compte courant
        '403':
          description: Session absente ou non autorisée
    patch:
      summary: Modifier le thème du compte authentifié
      description: Requiert une session et un jeton CSRF valide. Aucun identifiant de compte n'est accepté.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Theme'
      responses:
        '200':
          description: Thème mis à jour
        '400':
          description: Police ou palette invalide
        '403':
          description: Session/CSRF absent ou non autorisé
  /patient/care/professional/access-grants/:
    get:
      summary: Lister les demandes AccessGrant du professionnel authentifié
      description: Retourne uniquement les demandes liées au profil professionnel de la session.
      responses:
        '200':
          description: Demandes du professionnel
        '403':
          description: Profil professionnel absent
    post:
      summary: Demander un accès temporaire à un carnet
      description: Requiert un contexte professionnel, un établissement actif et un rattachement actif, ainsi que le QR temporaire affiché par le patient (jeton opaque à usage unique, 5 minutes). Un identifiant patient seul est refusé et n’est jamais renvoyé au professionnel. Le patient doit encore consentir. La demande expire après 7 jours; un refus bloque une nouvelle demande pendant 30 jours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, scope]
              properties:
                qr_token:
                  type: string
                  description: Jeton affiché par le patient (usage unique)
                scope:
                  type: array
                  items:
                    type: string
                    enum: [preconsultation, declarations, consultations]
      responses:
        '201':
          description: Demande créée en attente du consentement patient; demandes pending/active uniques par patient, professionnel et établissement
        '400':
          description: QR absent, expiré, déjà utilisé ou invalide ; préconditions cliniques, refus récent ou périmètre invalide
  /patient/care/professional/access-grants/{grant_id}/measurements/:
    parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Lister les mesures validées du patient dans l’établissement autorisé
      description: Requiert un AccessGrant actif avec le périmètre preconsultation, lié au professionnel et à son établissement actif. Le dossier personnel du professionnel est refusé. Les lectures sont auditées et la réponse est privée (no-store).
      responses:
        '200':
          description: Mesures du patient dans l’établissement, avec provenance et professionnel ayant saisi la donnée
        '403':
          description: Autorisation expirée, périmètre absent ou tentative d’accès à son propre dossier
        '404':
          description: Autorisation hors du professionnel ou de l’établissement actif
    post:
      summary: Saisir une mesure pendant une pré-consultation autorisée
      description: Requiert le même périmètre actif. Le serveur impose le patient, le professionnel, l’établissement et source=measured ; la mesure est auditée. Aucune valeur de diagnostic ou de seuil n’est ajoutée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value, unit]
              properties:
                kind:
                  type: string
                  enum: [temperature, heart_rate, spo2, blood_pressure, glycemia, weight, height]
                value:
                  type: string
                  maxLength: 32
                unit:
                  type: string
                  maxLength: 16
                measured_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Mesure créée avec source mesurée et attribution côté serveur
        '400':
          description: Type, valeur ou unité invalide
        '403':
          description: Autorisation expirée, périmètre absent ou tentative d’accès à son propre dossier
  /patient/care/professional/consultations/:
    get:
      summary: Lister les consultations validées par le professionnel courant
      responses:
        '200':
          description: Historique des consultations du professionnel
    post:
      summary: Valider une consultation à partir d’une pré-consultation autorisée
      description: L’AccessGrant doit être actif, comporter le scope preconsultation, être lié à l’établissement actif et au professionnel courant. La pré-consultation source doit être clôturée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_grant_id, source_encounter_id, attestation_svg]
              properties:
                access_grant_id:
                  type: string
                  format: uuid
                source_encounter_id:
                  type: string
                  format: uuid
                reason:
                  type: string
                observations:
                  type: string
                conclusion:
                  type: string
                care_plan:
                  type: string
                attestation_svg:
                  type: string
      responses:
        '201':
          description: Consultation validée et historisée
        '400':
          description: Autorisation absente, expirée, révoquée ou pré-consultation non clôturée
  /patient/care/appointments/options/:
    get:
      summary: Lister les options de rendez-vous
      description: Si establishment_id est présent, il doit être un UUID valide. Un établissement inconnu renvoie une liste de professionnels vide, sans révéler son existence.
      parameters:
        - name: establishment_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Établissements et professionnels éligibles
        '400':
          description: Identifiant d’établissement mal formé
  /patient/care/appointments/:
    get:
      summary: Lister les rendez-vous du patient authentifié
      description: La réponse patient ne contient pas de nom patient ; aucune date de naissance, coordonnée ou donnée médicale supplémentaire n’est exposée.
      responses:
        '200':
          description: Rendez-vous du patient courant
    post:
      summary: Demander un rendez-vous
      responses:
        '201':
          description: Rendez-vous créé
  /patient/care/appointments/{pk}/:
    post:
      summary: Accepter ou refuser une proposition, ou annuler un rendez-vous patient
      description: confirm-proposal accepte depuis requested ou confirmed et applique le nouveau créneau ; decline-proposal efface la proposition sans changer statut ni créneau initial. L’acceptation et le refus sont audités et déclenchent une notification push au professionnel après commit. Une annulation efface aussi les champs de proposition.
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [confirm-proposal, decline-proposal, cancel]
                reason:
                  type: string
                  description: Motif requis pour cancel.
      responses:
        '200':
          description: Proposition acceptée/refusée ou rendez-vous annulé
        '404':
          description: Rendez-vous absent du profil patient courant
        '409':
          description: Action impossible ou aucune proposition en attente
    patch:
      summary: Annuler un rendez-vous patient (compatibilité)
      description: Variante historique de l’action cancel ; les champs de proposition en attente sont effacés. L’identité du patient n’est jamais renvoyée.
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [cancel]
                reason:
                  type: string
      responses:
        '200':
          description: Rendez-vous annulé
        '404':
          description: Rendez-vous absent du profil patient courant
        '409':
          description: Annulation impossible dans l’état courant
  /patient/care/professional/appointments/:
    get:
      summary: Lister les rendez-vous du professionnel authentifié
      description: Limité au professionnel courant. Inclut uniquement le prénom et le nom du profil patient, y compris enfant ; aucune date de naissance, coordonnée ou donnée médicale supplémentaire. Les bornes sont ISO date ou date-heure, la période combinée est limitée à 92 jours et la réponse à 500 rendez-vous.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            description: Date ISO ou date-heure ISO 8601 ; borne incluse.
        - name: to
          in: query
          required: false
          schema:
            type: string
            description: Date ISO ou date-heure ISO 8601 ; borne exclue.
      responses:
        '200':
          description: Rendez-vous du professionnel avec identité minimale du profil patient (500 lignes au maximum)
        '400':
          description: Date invalide, bornes inversées ou fenêtre supérieure à 92 jours
        '403':
          description: Profil professionnel absent ou non vérifié
    post:
      summary: Gérer un rendez-vous du professionnel
      description: Une action propose exige starts_at futur avec fuseau, ends_at facultatif mais postérieur, et un motif de 500 caractères maximum. Elle est autorisée depuis requested ou confirmed ; le créneau confirmé d’origine reste effectif jusqu’à la décision du patient. Confirm et complete sont refusés (409) si une proposition attend encore une réponse. withdraw-proposal retire une proposition en attente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointment_id, action]
              properties:
                appointment_id:
                  type: string
                  format: uuid
                action:
                  type: string
                  enum: [propose, confirm, cancel, complete, withdraw-proposal]
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Rendez-vous mis à jour
        '400':
          description: Action invalide ou date, fuseau, ordre des dates ou motif invalide
        '403':
          description: Profil professionnel absent ou non vérifié
        '404':
          description: Rendez-vous absent de l’agenda du professionnel
        '409':
          description: Transition non autorisée
  /patient/care/establishment/{establishment_id}/appointments/:
    get:
      summary: Lister les rendez-vous d’un établissement
      description: Réservé à l’administrateur actif de l’établissement. Retourne uniquement identifiant technique, dates et statut ; aucun nom, motif ou détail médical.
      parameters:
        - name: establishment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rendez-vous limités aux dates et statuts
        '403':
          description: Administrateur actif requis
  /patient/care/encounters/:
    get:
      summary: Lister les pré-consultations du profil patient actif
      description: Réponse limitée au profil patient courant ; les contenus restent privés et ne sont pas exposés dans un agenda d’établissement.
      responses:
        '200':
          description: Pré-consultations du profil courant
        '403':
          description: Profil patient ou contexte invalide
    post:
      summary: Créer une pré-consultation patient
      description: Crée une pré-consultation liée au profil patient actif. Les modèles de structure sont renvoyés uniquement lorsqu’un rendez-vous admissible existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appointment_id:
                  type: string
                  format: uuid
                template_id:
                  type: integer
                template_responses:
                  type: object
                  additionalProperties: true
                reason:
                  type: string
                symptoms:
                  type: string
      responses:
        '201':
          description: Pré-consultation créée
        '400':
          description: Modèle ou réponses invalides
        '403':
          description: Profil patient ou rendez-vous non autorisé
  /patient/care/encounters/{pk}/:
    parameters:
      - name: pk
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Lire une pré-consultation du profil patient
      responses:
        '200':
          description: Pré-consultation du profil courant
        '404':
          description: Pré-consultation absente du profil courant
    patch:
      summary: Modifier une pré-consultation encore modifiable
      description: Les pré-consultations clôturées ne peuvent pas être modifiées.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Pré-consultation mise à jour
        '400':
          description: Données invalides ou pré-consultation clôturée
        '404':
          description: Pré-consultation absente du profil courant
  /patient/care/professional/access-grants/{pk}/encounters/:
    parameters:
      - name: pk
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Lire les pré-consultations autorisées par un accès professionnel
      description: Exige un AccessGrant actif avec le périmètre preconsultation, lié au professionnel et à l’établissement actifs. Les accès sont audités et la réponse n’est pas mise en cache.
      responses:
        '200':
          description: Pré-consultations autorisées pour le professionnel courant
        '403':
          description: Accès absent, expiré, révoqué ou hors périmètre
        '404':
          description: Accès inconnu du professionnel courant
  /patient/care/establishments/{establishment_id}/preconsultation-templates/:
    parameters:
      - name: establishment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Lister les modèles de pré-consultation d’un établissement
      description: Réservé à son administrateur actif. Les statuts incluent draft, active et disabled ; un modèle est créé en brouillon et ne devient actif qu’après approbation médicale.
      responses:
        '200':
          description: Modèles de l’établissement
        '403':
          description: Administrateur actif requis
    post:
      summary: Créer un modèle de pré-consultation en brouillon
      description: Jusqu’à 30 champs configurables ; aucune donnée clinique patient n’est créée par cette opération.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreconsultationTemplateInput'
      responses:
        '201':
          description: Modèle créé en brouillon
        '400':
          description: Nom ou définition de champs invalide
        '403':
          description: Administrateur actif requis
  /patient/care/establishments/{establishment_id}/preconsultation-templates/{pk}/:
    parameters:
      - name: establishment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pk
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Lire un modèle de pré-consultation
      responses:
        '200':
          description: Modèle dans l’établissement courant
        '403':
          description: Administrateur actif requis
        '404':
          description: Modèle absent de l’établissement
    patch:
      summary: Modifier un modèle qui n’est pas actif
      description: Un modèle actif doit d’abord être désactivé ; toute réactivation demande une nouvelle approbation médicale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreconsultationTemplateInput'
      responses:
        '200':
          description: Modèle mis à jour
        '400':
          description: Données du modèle invalides
        '403':
          description: Administrateur actif requis
        '409':
          description: Un modèle actif ne peut être modifié
    post:
      summary: Désactiver un modèle actif
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  const: deactivate
      responses:
        '200':
          description: Modèle désactivé ; son statut devient disabled
        '400':
          description: Action attendue deactivate
        '403':
          description: Administrateur actif requis
        '409':
          description: Seul un modèle actif peut être désactivé
  /patient/care/patient/preconsultation-templates/:
    get:
      summary: Lister les modèles actifs disponibles au patient
      description: Renvoie uniquement les modèles actifs des établissements concernés par un rendez-vous futur demandé ou confirmé du profil patient courant.
      responses:
        '200':
          description: Modèles actifs, limités au contexte de rendez-vous du patient
  /patient/care/professional/preconsultation-templates/pending/:
    get:
      summary: Lister les modèles en attente d’approbation médicale
      description: Réservé au référent médical vérifié, actif dans l’établissement sélectionné. Renvoie les modèles draft ou disabled.
      responses:
        '200':
          description: Modèles en attente
        '403':
          description: Référent médical actif requis
  /patient/care/professional/preconsultation-templates/{pk}/approve/:
    parameters:
      - name: pk
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Approuver médicalement un modèle
      description: Réservé au référent médical vérifié et actif de l’établissement courant. Une confirmation explicite est obligatoire ; un seul modèle actif est permis par établissement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_medical_review]
              properties:
                confirm_medical_review:
                  type: boolean
                  const: true
      responses:
        '200':
          description: Modèle approuvé et actif
        '400':
          description: Confirmation médicale manquante
        '403':
          description: Référent médical actif requis
        '404':
          description: Modèle absent de l’établissement courant
        '409':
          description: Modèle non admissible ou un autre modèle déjà actif
  /establishments/{establishment_id}/patients/{patient_id}/openings/:
    parameters:
      - name: establishment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Ouvrir un accès motivé au dossier d’un patient
      description: Réservé à l’administrateur actif. La lecture clinique est désactivée par défaut et demeure soumise au paramètre ECARNET_ESTABLISHMENT_ADMIN_CLINICAL_READ, aux décisions légales et à la recette. L’ouverture est auditée, notifiée au patient et doit être clôturée ; ne jamais interpréter cette route comme un accès permanent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordOpeningInput'
      responses:
        '201':
          description: Ouverture créée ; réponse privée no-store avec identifiant, motif, dates d’ouverture et d’expiration
        '400':
          description: Motif invalide ou précision requise pour autre
        '403':
          description: Administrateur actif requis ou lecture clinique désactivée
        '404':
          description: Patient non admissible dans cet établissement
  /establishments/{establishment_id}/openings/:
    parameters:
      - name: establishment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Lister les ouvertures de dossier d’un établissement
      description: Réservé à l’administrateur actif. Au plus 200 lignes ; métadonnées d’accès seulement, sans nom de patient ni contenu clinique.
      responses:
        '200':
          description: Ouvertures avec identifiant, catégorie de motif, dates et état
        '403':
          description: Administrateur actif requis
  /establishments/{establishment_id}/openings/{opening_id}/close/:
    parameters:
      - name: establishment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: opening_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Clôturer une ouverture de dossier
      description: La clôture est irréversible, auditée et notifiée au patient.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 140
      responses:
        '200':
          description: Ouverture clôturée
        '400':
          description: Note supérieure à 140 caractères
        '403':
          description: Administrateur actif requis
        '404':
          description: Ouverture inconnue de cet établissement
        '409':
          description: Ouverture déjà clôturée
  /establishments/{establishment_id}/openings/{opening_id}/record/:
    parameters:
      - name: establishment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: opening_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Lire les données couvertes par une ouverture de dossier
      description: Réservé à son administrateur initiateur, pendant la période permise et avant clôture. La lecture clinique reste désactivée par défaut et le contenu ne doit jamais être utilisé sans autorisation légale et recette explicites. Réponse privée no-store.
      responses:
        '200':
          description: Sections de dossier autorisées pour cette ouverture
        '403':
          description: Fonction désactivée, ouverture expirée/clôturée ou administrateur non autorisé
        '404':
          description: Ouverture inconnue
  /establishments/{establishment_id}/memberships/{membership_id}/medical-referent/:
    parameters:
      - name: establishment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Désigner ou retirer un référent médical
      description: Réservé à l’administrateur actif. Le rattachement doit être actif et appartenir à l’établissement ; le professionnel doit être vérifié. L’auto-désignation est refusée. L’événement est audité sans contenu clinique et le professionnel est notifié après commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_medical_referent]
              properties:
                is_medical_referent:
                  type: boolean
      responses:
        '200':
          description: Désignation mise à jour
        '400':
          description: La valeur n’est pas un booléen strict
        '403':
          description: Administrateur actif requis, rattachement inadmissible ou auto-désignation
        '404':
          description: Rattachement absent de cet établissement
  /establishments/{establishment_id}/join-codes/active-count/:
    parameters:
      - name: establishment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Compter les codes de jonction encore actifs
      description: Réservé à l’administrateur actif. Compte seulement les codes non consommés, non révoqués, non expirés et dont la valeur chiffrée est présente. Réponse privée no-store.
      responses:
        '200':
          description: Compteur des codes actifs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveJoinCodeCount'
        '403':
          description: Administrateur actif requis
  /identity/monitoring/webhook/:
    post:
      summary: Recevoir un événement de monitoring signé
      description: |-
        Endpoint sans session, authentifié par HMAC-SHA256. La signature est `sha256=` suivi de l’hexadécimal HMAC-SHA256 de la séquence exacte `horodatage.identifiant.corps` (octets du corps HTTP bruts, séparateurs ASCII `.`), calculée avec `ECARNET_MONITOR_WEBHOOK_SECRET`. L’horodatage Unix doit respecter la tolérance configurée (300 secondes par défaut) et l’identifiant doit être un UUID. Un UUID déjà reçu renvoie 200 avec `already_received: true` sans rejouer l’effet.
      security: []
      parameters:
        - name: X-Ecarnet-Monitor-Timestamp
          in: header
          required: true
          description: Horodatage Unix en secondes, signé comme texte exact.
          schema:
            type: string
            pattern: '^[0-9]{1,12}$'
        - name: X-Ecarnet-Monitor-Event-Id
          in: header
          required: true
          description: UUID unique de l’événement ; participe à la signature et à l’idempotence.
          schema:
            type: string
            format: uuid
        - name: X-Ecarnet-Monitor-Signature
          in: header
          required: true
          description: Préfixe `sha256=` puis HMAC hexadécimal sur les octets de `timestamp.event_id.body`.
          schema:
            type: string
            pattern: '^sha256=[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringEvent'
      responses:
        '200':
          description: Événement accepté ou identifiant déjà reçu ; dans ce dernier cas `already_received` vaut true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringWebhookSuccess'
        '400':
          description: JSON, action, catégorie, sévérité ou champs d’événement invalides
        '401':
          description: Signature, horodatage ou identifiant invalide
        '429':
          description: Limite de débit dépassée
components:
  schemas:
    RecordOpeningInput:
      type: object
      required: [reason_category]
      properties:
        reason_category:
          type: string
          enum: [urgence, soins_en_cours, continuite_soins, demande_patient, facturation_assurance, qualite_audit, reclamation, autre]
        reason_note:
          type: string
          maxLength: 140
          description: Obligatoire et non vide pour autre ; interdite pour les autres catégories.
    PreconsultationTemplateInput:
      type: object
      required: [name, fields]
      properties:
        name:
          type: string
          minLength: 2
        fields:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/PreconsultationField'
    PreconsultationField:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        label:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [text, number, choice, yes_no]
        unit:
          type: string
          maxLength: 24
        required:
          type: boolean
          default: false
        options:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 80
    PreconsultationTemplate:
      allOf:
        - $ref: '#/components/schemas/PreconsultationTemplateInput'
        - type: object
          properties:
            id:
              type: integer
            active:
              type: boolean
            status:
              type: string
              enum: [draft, active, disabled]
            approved_by:
              type: integer
              nullable: true
            approved_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ActiveJoinCodeCount:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [count]
          properties:
            count:
              type: integer
              minimum: 0
    MonitoringEvent:
      type: object
      required: [incident_key, summary]
      properties:
        incident_key:
          type: string
          minLength: 1
          maxLength: 160
        action:
          type: string
          enum: [open, resolve]
          default: open
        severity:
          type: string
          enum: [info, warning, major, critical]
          default: warning
        category:
          type: string
          enum: [api, database, cache, storage, backup, email, security]
          default: api
        summary:
          type: string
          minLength: 1
          maxLength: 240
    MonitoringWebhookSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [event_id]
          properties:
            event_id:
              type: string
              format: uuid
            incident_id:
              type: string
              format: uuid
              nullable: true
            already_received:
              type: boolean
              description: true si cet identifiant unique avait déjà été accepté ; réponse 200 idempotente.
            created:
              type: boolean
            status:
              type: string
              enum: [open, resolved, unknown]
    Theme:
      type: object
      required: [font, palette]
      properties:
        font:
          type: string
          enum: [Plus Jakarta Sans, Nunito, Lexend, Manrope, Sora, Mooli, Unbounded, Quicksand, Bricolage Grotesque, Barlow, Ubuntu, Fredoka]
        palette:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
