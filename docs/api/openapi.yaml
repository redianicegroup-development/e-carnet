openapi: 3.1.0
info:
  title: Mon Carnet Numérique API
  version: 0.1.0
  description: Contrat de la tranche Fondation. Pas de données cliniques exposées.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health/:
    get:
      summary: Vérifier la disponibilité historique de l’API
      security: []
      responses:
        '200':
          description: API opérationnelle
  /health/live/:
    get:
      summary: Vérifier que le processus API répond
      security: []
      responses:
        '200':
          description: Processus opérationnel
  /health/ready/:
    get:
      summary: Vérifier que l’API peut joindre sa base
      security: []
      responses:
        '200':
          description: API prête
        '503':
          description: Base indisponible ; la réponse ne divulgue aucun détail de connexion
  /csrf/:
    get:
      summary: Obtenir un cookie CSRF pour les requêtes navigateur
      security: []
      responses:
        '200':
          description: Jeton CSRF établi dans un cookie
  /identity/me/theme/:
    get:
      summary: Charger les préférences de thème du compte authentifié
      responses:
        '200':
          description: Thème du compte courant
        '403':
          description: Session absente ou non autorisée
    patch:
      summary: Modifier le thème du compte authentifié
      description: Requiert une session et un jeton CSRF valide. Aucun identifiant de compte n'est accepté.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Theme'
      responses:
        '200':
          description: Thème mis à jour
        '400':
          description: Police ou palette invalide
        '403':
          description: Session/CSRF absent ou non autorisé
  /patient/care/professional/access-grants/:
    get:
      summary: Lister les demandes AccessGrant du professionnel authentifié
      description: Retourne uniquement les demandes liées au profil professionnel de la session.
      responses:
        '200':
          description: Demandes du professionnel
        '403':
          description: Profil professionnel absent
    post:
      summary: Ouvrir un accès temporaire à un carnet (scan du QR du patient)
      description: Requiert un contexte professionnel, un établissement actif et un rattachement actif, ainsi que le QR temporaire affiché par le patient (jeton opaque à usage unique, 5 minutes). Un identifiant patient seul est refusé et n’est jamais renvoyé au professionnel. Règle du 08/11/2026 - le scan vaut accord - pour le périmètre de base (preconsultation, declarations, documents) l’accès est actif tout de suite, 2 heures, et un seul professionnel peut être connecté à un patient à la fois (400 si un autre professionnel est déjà connecté ; le QR n’est pas consommé). Un périmètre plus large (consultations, care_history) reste une demande en attente du consentement du patient (7 jours; un refus bloque une nouvelle demande de ce type pendant 30 jours).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, scope]
              properties:
                qr_token:
                  type: string
                  description: Jeton affiché par le patient (usage unique)
                scope:
                  type: array
                  items:
                    type: string
                    enum: [preconsultation, declarations, consultations]
      responses:
        '201':
          description: Accès actif (périmètre de base) ou demande en attente (périmètre élargi) ; accès pending/active uniques par patient, professionnel et établissement
        '400':
          description: QR absent, expiré, déjà utilisé ou invalide ; autre professionnel déjà connecté ; préconditions cliniques, refus récent (périmètre élargi) ou périmètre invalide
  /patient/care/professional/access-grants/{pk}/end/:
    parameters:
      - name: pk
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Le professionnel met fin à son propre accès
      description: Fin de consultation. L’accès passe à « expired », le patient est notifié et peut se connecter à un autre professionnel sans attendre les 2 heures.
      responses:
        '200':
          description: Accès terminé
        '404':
          description: Autorisation introuvable ou appartenant à un autre professionnel
        '409':
          description: L’accès n’est plus actif
  /patient/care/notifications/inbox/:
    get:
      summary: Boîte de notifications du patient (cloche)
      description: Les 30 plus récentes, avec unread_count et total_count. Réponse Cache-Control private, no-store.
      responses:
        '200':
          description: Boîte du patient authentifié
  /patient/care/notifications/pulse/:
    get:
      summary: Pouls de la cloche (temps réel par interrogation légère)
      description: Une requête agrégée de quelques octets (unread_count, total_count, latest_at). Le navigateur l’interroge toutes les 5 s tant que l’écran est visible et ne recharge la boîte que si le résumé change.
      responses:
        '200':
          description: Résumé de la boîte
  /patient/care/notifications/{pk}/:
    parameters:
      - name: pk
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Effacer une notification
      description: N’efface que la boîte du patient authentifié ; le journal des accès n’est pas touché.
      responses:
        '200':
          description: Notification effacée
        '404':
          description: Notification introuvable
  /patient/care/notifications/read-all/:
    post:
      summary: Marquer toutes les notifications comme lues
      responses:
        '200':
          description: Nombre de notifications mises à jour
  /patient/care/notifications/clear/:
    post:
      summary: Effacer toutes les notifications (ou seulement les lues avec only_read)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                only_read:
                  type: boolean
      responses:
        '200':
          description: Nombre de notifications effacées
  /patient/care/professional/access-grants/{grant_id}/measurements/:
    parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Lister les mesures validées du patient dans l’établissement autorisé
      description: Requiert un AccessGrant actif avec le périmètre preconsultation, lié au professionnel et à son établissement actif. Le dossier personnel du professionnel est refusé. Les lectures sont auditées et la réponse est privée (no-store).
      responses:
        '200':
          description: Mesures du patient dans l’établissement, avec provenance et professionnel ayant saisi la donnée
        '403':
          description: Autorisation expirée, périmètre absent ou tentative d’accès à son propre dossier
        '404':
          description: Autorisation hors du professionnel ou de l’établissement actif
    post:
      summary: Saisir une mesure pendant une pré-consultation autorisée
      description: Requiert le même périmètre actif. Le serveur impose le patient, le professionnel, l’établissement et source=measured ; la mesure est auditée. Aucune valeur de diagnostic ou de seuil n’est ajoutée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value, unit]
              properties:
                kind:
                  type: string
                  enum: [temperature, heart_rate, spo2, blood_pressure, glycemia, weight, height]
                value:
                  type: string
                  maxLength: 32
                unit:
                  type: string
                  maxLength: 16
                measured_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Mesure créée avec source mesurée et attribution côté serveur
        '400':
          description: Type, valeur ou unité invalide
        '403':
          description: Autorisation expirée, périmètre absent ou tentative d’accès à son propre dossier
  /patient/care/professional/consultations/:
    get:
      summary: Lister les consultations validées par le professionnel courant
      responses:
        '200':
          description: Historique des consultations du professionnel
    post:
      summary: Valider une consultation à partir d’une pré-consultation autorisée
      description: L’AccessGrant doit être actif, comporter le scope preconsultation, être lié à l’établissement actif et au professionnel courant. La pré-consultation source doit être clôturée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_grant_id, source_encounter_id, attestation_svg]
              properties:
                access_grant_id:
                  type: string
                  format: uuid
                source_encounter_id:
                  type: string
                  format: uuid
                reason:
                  type: string
                observations:
                  type: string
                conclusion:
                  type: string
                care_plan:
                  type: string
                attestation_svg:
                  type: string
      responses:
        '201':
          description: Consultation validée et historisée
        '400':
          description: Autorisation absente, expirée, révoquée ou pré-consultation non clôturée
  /patient/care/professional/emergency-access/:
    get:
      summary: Accès d’urgence « bris de glace » du professionnel (ACS-13) — mes accès et la liste fermée des motifs
      description: Répond 404 `break_glass_disabled` tant que ECARNET_BREAK_GLASS_ENABLED est faux (cas par défaut).
      responses:
        '200':
          description: Accès du professionnel (statut, motif, fenêtre, revue), durée en minutes, motifs possibles
        '403':
          description: Profil professionnel absent
        '404':
          description: Fonction désactivée (`break_glass_disabled`)
    post:
      summary: Ouvrir un accès d’urgence à la seule fiche d’urgence d’un patient (1 h au plus, non renouvelable)
      description: >
        Le patient est désigné par son identité exacte (nom, prénom, date de naissance ; téléphone facultatif pour départager des
        homonymes). Motif de la liste fermée et texte libre (10 à 280 caractères) obligatoires, contrôlés avant toute recherche.
        Rejouée pendant que l’accès est ouvert, la demande retrouve le même accès (200) sans le prolonger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, birth_date, reason_category, reason_note]
              properties:
                first_name: {type: string}
                last_name: {type: string}
                birth_date: {type: string, format: date}
                phone: {type: string}
                reason_category: {type: string, enum: [unconscious, vital_danger, cannot_consent]}
                reason_note: {type: string, minLength: 10, maxLength: 280}
      responses:
        '201':
          description: Accès ouvert ; renvoie l’accès et la fiche d’urgence (identité, groupe sanguin, allergies, traitements, antécédents)
        '200':
          description: Accès déjà ouvert pour ce patient par ce professionnel (même accès, même fin)
        '400':
          description: Motif ou identification incomplets (`reason_required`, `reason_too_long`, `identification_incomplete`)
        '403':
          description: Professionnel non vérifié ou non rattaché (`not_eligible`)
        '404':
          description: Aucun dossier unique ne correspond (`patient_not_identified`, réponse identique si le dossier n’existe pas ou est ambigu) ou fonction désactivée
        '409':
          description: Accès non renouvelable pendant 24 h (`not_renewable`) ou accès déjà ouvert par le patient (`consent_available`)
        '429':
          description: Trop de tentatives
  /patient/care/professional/emergency-access/{id}/:
    get:
      summary: Relire la fiche d’urgence pendant la fenêtre ouverte (chaque lecture est tracée)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Fiche d’urgence
        '403':
          description: Fenêtre terminée (`expired`), autre établissement (`wrong_establishment`) ou professionnel plus éligible
        '404':
          description: Accès introuvable ou ouvert par un autre professionnel
  /patient/care/establishment/{establishment_id}/emergency-access/:
    get:
      summary: Accès d’urgence de l’établissement et état de leur revue (administrateurs actifs seulement, aucun contenu clinique)
      parameters:
        - {name: establishment_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Liste avec état de revue `pending`, `overdue` ou `done`
        '403':
          description: Réservé aux administrateurs de cet établissement
        '404':
          description: Fonction désactivée
  /patient/care/establishment/{establishment_id}/emergency-access/{id}/review/:
    post:
      summary: Revue a posteriori d’un accès d’urgence (une décision, définitive, sous 72 h)
      parameters:
        - {name: establishment_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: {type: string, enum: [justified, unjustified]}
                note: {type: string, maxLength: 500, description: Obligatoire si `unjustified`}
      responses:
        '201':
          description: Revue enregistrée ; un abus est signalé (incident de sécurité, patient prévenu)
        '400':
          description: Décision ou note invalide (`invalid_outcome`, `note_required`, `note_too_long`)
        '403':
          description: Pas administrateur de cet établissement, ou accès du revieweur lui-même (`review_conflict`)
        '404':
          description: Accès introuvable dans cet établissement
        '409':
          description: Accès encore ouvert (`still_active`) ou déjà revu (`already_reviewed`)
components:
  schemas:
    Theme:
      type: object
      required: [font, palette]
      properties:
        font:
          type: string
          enum: [Plus Jakarta Sans, Nunito, Lexend, Manrope, Sora, Mooli, Unbounded, Quicksand, Bricolage Grotesque, Barlow, Ubuntu, Fredoka]
        palette:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
